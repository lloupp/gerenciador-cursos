<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Cursos e Eventos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="header-row">
          <h1 class="app-title">
            <span class="app-icon">🎓</span>
            <span class="app-title-text">Gerenciador de Cursos</span>
          </h1>
          <button class="menu-toggle" id="menu-toggle" aria-label="Alternar menu" aria-expanded="false">
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
          </button>
        </div>
        <p class="app-subtitle">Organize eventos, inscrições e finanças em um só lugar</p>
      </div>
    </header>

    <!-- Tabs de navegação -->
    <nav class="tabs-nav" role="tablist" id="tabs-nav">
      <button class="tab-btn active" data-tab="events" role="tab" aria-selected="true">
        <span class="tab-icon">📅</span>
        <span class="tab-label">Eventos</span>
      </button>
      <button class="tab-btn" data-tab="registrations" role="tab" aria-selected="false">
        <span class="tab-icon">👥</span>
        <span class="tab-label">Inscrições</span>
      </button>
      <button class="tab-btn" data-tab="finance" role="tab" aria-selected="false">
        <span class="tab-icon">💸</span>
        <span class="tab-label">Financeiro</span>
      </button>
      <button class="tab-btn" data-tab="dashboard" role="tab" aria-selected="false">
        <span class="tab-icon">📊</span>
        <span class="tab-label">Dashboard</span>
      </button>
      <button class="tab-btn" data-tab="reports" role="tab" aria-selected="false">
        <span class="tab-icon">📋</span>
        <span class="tab-label">Relatórios</span>
      </button>
    </nav>

    <!-- Container das seções -->
    <main class="tab-content" id="tab-content">
      <!-- Conteúdo renderizado dinamicamente pelo app.js -->
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Gerenciador de Cursos — Dados salvos localmente no seu navegador</p>
    </footer>
  </div>

  <!-- Toast notifications container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Modal de confirmação -->
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title-text" style="display:none">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title-text">Confirmação</h3>
        <button class="modal-close" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-message"></p>
      </div>
      <div class="modal-footer">
        <button class="btn modal-btn-cancel">Cancelar</button>
        <button class="btn btn-primary modal-btn-confirm">Confirmar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
